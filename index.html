function noiseTex(base, rep, amp) {

}

function decorate(k, MP) { // только визуальный декор, без коллизий

function gameTick(dt) {
  const now = Date.now();
  if (selfAv) { selfAv.position.set(pos.x, 0, pos.z); const fw = new THREE.Vector3(0,0,-1).applyQuaternion(headQ); selfAv.rotation.y = Math.atan2(-fw.x, -fw.z); }
  if (mode == 'duel' || mode == 'killer') {
    const cnt = Object.keys(players).length;
    if (cnt != lastCnt) { lastCnt = cnt; if (mode == 'duel') duelReset(); else startRound(); }
    if (kills != lastKills) { lastKills = kills; if (mode == 'duel') resetAt = now + 3000; }
    if (resetAt && now > resetAt && !winner) { resetAt = 0; duelReset(); }
    if (mode == 'killer') roundTick(now);
  }
  if (gest == 'peace' && now > dashCd && !dead) { dashT = now + 800; dashCd = now + 5000; }
  fxs.forEach((f, i) => { const a = (performance.now() - f.t)/1000, life = f.k == 'line' ? .2 : .5;
    if (f.k != 'line') { f.m.scale.setScalar(1 + a*2); f.m.material.opacity = Math.max(0, 1 - a/life); }
    if (a > life) { scene.remove(f.m); fxs.splice(i, 1); } });
  if (mode == 'tag') return;
  const f = new THREE.Vector3(0,0,-1).applyQuaternion(headQ); f.y = 0; f.normalize();
  const n = slots.length;
  slots.forEach((sl, i) => { const o = (i - (n-1)/2) * .2; sl.position.set(pos.x + f.x*.3 - f.z*o, 1.1, pos.z + f.z*.3 + f.x*o); sl.rotation.y += dt; });
  head.updateMatrixWorld(true);
  if (handGroup.visible) { const w = handDots[9].getWorldPosition(new THREE.Vector3()); slots.forEach(sl => { if (w.distanceTo(sl.position) < .17) equip(sl.userData.t); }); }
  if (toolMesh) { toolMesh.visible = handGroup.visible; toolMesh.position.copy(handDots[9].position); }
  if (gest == 'point') fire();
  if (gest == 'rock' && now > swCd && slots.length) { swCd = now + 700; const ts = [...MODES[mode][1], null]; equip(ts[(ts.indexOf(tool) + 1) % ts.length]); }
  for (let i = projs.length - 1; i >= 0; i--) {
    const q = projs[i]; q.p.addScaledVector(q.v, dt); q.m.position.copy(q.p);
    const bang = q.p.y < .1 || Math.abs(q.p.x) > ARENA || Math.abs(q.p.z) > ARENA || obstacles.some(o => Math.hypot(q.p.x-o.x, q.p.z-o.z) < o.r)
      || Object.keys(players).some(id => id != me && !players[id].dd && players[id].x != null && Math.hypot(q.p.x-players[id].x, q.p.z-players[id].z) < .7);
    if (bang) { explode(q.p); scene.remove(q.m); projs.splice(i, 1); }
  }
  if (dead && now - dead > 3000 && !winner && mode != 'killer') { if (mode == 'duel') { myDeaths++; duelReset(); } else { dead = 0; hp = 100; pos.set((Math.random()-.5)*ARENA*1.4, 0, (Math.random()-.5)*ARENA*1.4); } }
  if (offline) players[me].k = kills;
  if (!winner) { for (const id in players) if ((id == me ? kills : players[id].k||0) >= KILLS) { winner = players[id].n; winT = now; } }
  else if (now - winT > 6000) {
    winner = null; kills = 0; myDeaths = 0; hp = 100; dead = 0;
    if (offline) BOTS.forEach(id => Object.assign(players[id], {k:0, hp:100, dd:0}));
  }
}
function botFight(id, dt) {
  const b = players[id], now = Date.now(), lvl = +$('diff').value, role = b.ro;
  if (b.dd) { if (mode != 'killer' && mode != 'duel' && now - b.dd > 3000) { b.dd = 0; b.hp = 100; b.x = pos.x > 0 ? -ARENA*.7 : ARENA*.7; b.z = pos.z > 0 ? -ARENA*.7 : ARENA*.7; } return; }
  if (winner || roundEnd || (mode != 'killer' && dead) || now < hold + [900, 550, 300][lvl]) return;
  let tg = null, td = 1e9;
  for (const k in players) {
    if (k == id || isDead(k)) continue;
    const q = players[k], qx = k == me ? pos.x : q.x, qz = k == me ? pos.z : q.z; if (qx == null) continue;
    if (mode == 'killer' && role != 'killer' && roleOf(k) != 'killer') continue; // шериф и выжившие следят за убийцей
    const dd = Math.hypot(qx - b.x, qz - b.z); if (dd < td) { td = dd; tg = {k, x: qx, z: qz}; }
  }
  if (!tg) return;
  const T = TOOLS[b.t], dx = tg.x - b.x, dz = tg.z - b.z, d = Math.hypot(dx, dz) || 1;
  const surv = mode == 'killer' && role == 'survivor', pref = T.r ? 1.2 : b.t == 'gun' ? 7 : b.t == 'revolver' ? 8 : 10;
  let sv = surv ? (d < 12 ? -1 : 0) : d > pref ? 1 : d < pref - 1.5 ? -1 : 0;
  if (mode == 'duel') sv = 0;
  const st = mode == 'duel' ? 0 : Math.sin(now/900 + (id == 'bot2' ? 2 : 0)) * .6;
  let vx = dx/d*sv - dz/d*st, vz = dz/d*sv + dx/d*st;
  const l = Math.hypot(vx, vz) || 1; vx /= l; vz /= l;
  b.x += vx*botSpeed*.8*dt; b.z += vz*botSpeed*.8*dt;
  b.x = Math.max(-ARENA+.6, Math.min(ARENA-.6, b.x)); b.z = Math.max(-ARENA+.6, Math.min(ARENA-.6, b.z));
  obstacles.forEach(o => { const ox = b.x-o.x, oz = b.z-o.z, od = Math.hypot(ox, oz), min = o.r + .4;
    if (od < min && od > 0) { b.x = o.x + ox/od*min; b.z = o.z + oz/od*min; } });
  b.r = Math.atan2(-dx, -dz);
  if (!surv && now > b.next && d < (T.r || 20)) {
    b.next = now + T.cd*1000*[2.2, 1.5, 1.1][lvl] + 300;
    const from = new THREE.Vector3(b.x, 1.4, b.z), to = new THREE.Vector3(tg.x, 1.2, tg.z);
    if (b.t == 'gun' || b.t == 'revolver') addFx('line', from, to, 0);
    if (b.t == 'bazooka') addFx('boom', to, null, 3);
    if (Math.random() < [.3, .5, .75][lvl]) {
      const dm = (mode == 'killer' || mode == 'duel') ? 100 : T.d * [.6, .8, 1][lvl];
      if (tg.k == me) hurt(dm, id);
      else { const q = players[tg.k]; q.hp -= dm; if (q.hp <= 0) { q.dd = now; b.k = (b.k||0) + 1; } }
    }
  }
}

// ====== Дуэль ковбоев и «Загадка убийцы» ======
const ROLEN = {killer:'🔪 Убийца', sheriff:'🤠 Шериф', survivor:'🙂 Выживший'};
let hold = 0, resetAt = 0, myRole = '', roundEnd = null, roundStart = 0, seed0 = 0, myDeaths = 0, selfAv = null, BOTS = ['bot'], lastCnt = -1, lastKills = 0;
const isDead = id => id == me ? !!dead : !!(players[id] && players[id].dd);
const roleOf = id => id == me ? myRole : (players[id] && players[id].ro) || 'survivor';
function setupMe() {
  KILLS = mode == 'duel' ? 3 : mode == 'killer' ? 999 : 5;
  selfAv = makeAvatar(SKINCOL[SK.c], SK); selfAv.userData.head.visible = false; // своё тело видно, если посмотреть вниз
  prof.sk = SK; if (typeof save == 'function') save(); else if (user) db.ref('users/' + user.uid + '/sk').set(SK);
  if (mode == 'duel') { equip('revolver'); hold = Date.now() + 6000; }
}
function duelReset() {
  const ids = offline ? [me, 'bot'] : Object.keys(players).sort(), i = Math.max(0, ids.indexOf(me));
  pos.set(i ? 6 : -6, 0, 0); hp = 100; dead = 0;
  hold = Date.now() + 4000 + ((kills + myDeaths) * 7919 % 2500); // одинаковая задержка у обоих дуэлянтов
  if (offline) Object.assign(players.bot, {x: i ? -6 : 6, z: 0, dd: 0, hp: 100});
}
function startRound() {
  const ids = offline ? [me, ...BOTS] : Object.keys(players).sort();
  const P = [['killer','sheriff','survivor'],['sheriff','survivor','killer'],['survivor','killer','sheriff'],['killer','survivor','sheriff'],['sheriff','killer','survivor'],['survivor','sheriff','killer']];
  const sd = offline ? Math.random()*6|0 : seed0;
  const rl = ids.length < 3 ? (sd % 2 ? ['killer','sheriff'] : ['sheriff','killer']) : P[sd % 6];
  ids.forEach((id, i) => { const r = rl[i] || 'survivor';
    if (id == me) myRole = r;
    else if (offline) Object.assign(players[id], {ro: r, hp: 100, dd: 0, t: r == 'killer' ? 'knife' : r == 'sheriff' ? 'revolver' : 'fist',
      x: (Math.random()-.5)*ARENA*1.4, z: (Math.random()-.5)*ARENA*1.4});
  });
  hp = 100; dead = 0; roundEnd = null; roundStart = Date.now();
  pos.set((Math.random()-.5)*ARENA*1.4, 0, (Math.random()-.5)*ARENA*1.4);
  equip(myRole == 'killer' ? 'knife' : myRole == 'sheriff' ? 'revolver' : null);
  if (!offline) roomRef.child('players/' + me).update({ro: myRole, dd: 0, hp: 100});
}
function roundTick(now) {
  if (!myRole || now - roundStart < 3000 || (!offline && Object.keys(players).length < 2)) return;
  if (!roundEnd) {
    const al = Object.keys(players).filter(id => !isDead(id));
    const ka = al.some(id => roleOf(id) == 'killer'), oa = al.some(id => roleOf(id) != 'killer');
    const text = !ka ? '🏆 Убийцу поймали! Победили выжившие' : !oa ? '🔪 Убийца победил!' : now - roundStart > 120000 ? '⏰ Время вышло — победили выжившие' : '';
    if (text) roundEnd = {text, t: now, s: seed0};
  } else if (now - roundEnd.t > 5000) {
    if (offline) startRound();
    else { roundEnd.t = now; if (Object.keys(players).sort()[0] == me) roomRef.child('seed').transaction(c => c === roundEnd.s ? c + 1 : undefined); }
  }
}
function modeHud() {
  const now = Date.now();
  if (mode == 'duel') return now < hold ? '🤠 ПРИГОТОВЬСЯ…\n' : now < hold + 1200 ? '🔫 ОГОНЬ!\n' : '';
  if (mode == 'killer') return roundEnd ? roundEnd.text + '\n' : '🎭 ' + (ROLEN[myRole] || '…') + ' · ⏱ ' + Math.max(0, 120 - ((now - roundStart)/1000|0)) + 'с\n';
  return '';
}

// ====== Бот для тренировки (работает без интернета и Firebase) ======
function initBot() {
  botSpeed = [2.8, 3.6, 4.2][+$('diff').value];
  players[me] = {n: myName, k: 0};
  players.bot = {x: pos.x > 0 ? -ARENA*.7 : ARENA*.7, z: pos.z > 0 ? -ARENA*.7 : ARENA*.7, r: 0, n: 'Бот', c: 0xff9f43};
  if (mode == 'tag') { itId = 'bot'; tagT = Date.now(); } // бот водит, первые 3 с стоит
  const ts = MODES[mode][1];
  Object.assign(players.bot, {hp:100, k:0, dd:0, next:Date.now()+2500, t: ts[Math.random()*ts.length|0] || 'fist', sk: {c:4, h:1, b:0, a:1, l:0}});
  if (mode == 'killer') { BOTS = ['bot', 'bot2']; players.bot2 = {x: -players.bot.x, z: players.bot.z, r: 0, n: 'Бот 2', c: 0x5dd66a, hp:100, k:0, dd:0, next: Date.now()+2500, t:'fist', sk: {c:1, h:0, b:1, a:1, l:1}}; }
}
function setIt(id) {
  tagT = Date.now();
  if (offline) itId = id; else itRef.set({id, t: tagT});
}
function updateBot(dt) {
  if (mode != 'tag') return BOTS.forEach(id => botFight(id, dt));
  const b = players.bot, now = Date.now();
  const dx = pos.x - b.x, dz = pos.z - b.z, d = Math.hypot(dx, dz) || 1;
  const chase = itId === 'bot';
  if (chase) {
    if (now - tagT < 3000) return; // заморожен после захвата
    if (d < 1.2 && py < 1.3) { setIt(me); if (navigator.vibrate) navigator.vibrate(300); return; }
  }
  let vx = chase ? dx/d : -dx/d, vz = chase ? dz/d : -dz/d;
  if (!chase) { // убегая, держится подальше от стен и тянется к центру
    const k = Math.max(Math.abs(b.x), Math.abs(b.z)) / ARENA;
    vx += -b.x/ARENA*k*k*3; vz += -b.z/ARENA*k*k*3;
    const t = now/700; vx += Math.sin(t)*.3; vz += Math.cos(t)*.3;
  }
  obstacles.forEach(o => { // огибает препятствия
    const ox = b.x-o.x, oz = b.z-o.z, od = Math.hypot(ox, oz) || 1;
    if (od < o.r + 3) { const w = (o.r + 3 - od)/3 * (chase ? 1.2 : 2); vx += ox/od*w; vz += oz/od*w; }
  });
  const l = Math.hypot(vx, vz) || 1; vx /= l; vz /= l;
  b.x += vx*botSpeed*dt; b.z += vz*botSpeed*dt;
  b.x = Math.max(-ARENA+.6, Math.min(ARENA-.6, b.x)); b.z = Math.max(-ARENA+.6, Math.min(ARENA-.6, b.z));
  obstacles.forEach(o => {
    const ox = b.x-o.x, oz = b.z-o.z, od = Math.hypot(ox, oz), min = o.r + .4;
    if (od < min && od > 0) { b.x = o.x + ox/od*min; b.z = o.z + oz/od*min; }
  });
  b.r = Math.atan2(-vx, -vz);
}

// ====== Отслеживание рук (MediaPipe) ======
function initHands(video) {
  const hands = new Hands({locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/' + f});
  hands.setOptions({maxNumHands:1, modelComplexity:1, minDetectionConfidence:.5, minTrackingConfidence:.5});
  let buf = [], was = [0,0,0,0], wasTh = 0, seenT = 0, pWy = null, pT = 0, jCd = 0;
  hands.onResults(r => {
    const now = performance.now(), lm = r.multiHandLandmarks && r.multiHandLandmarks[0];
    if (!lm) { if (now - seenT > 350) { handGroup.visible = false; moving = false; gest = 'none'; buf = []; pWy = null; } return; } // рука пропала на миг — держим жест
    seenT = now; handGroup.visible = true;
    const W = .84, H = .63, D = .6;
    lm.forEach((p, i) => handDots[i].position.set((p.x-.5)*W, (.5-p.y)*H, -D + p.z*-.5));
    const d = (a, b) => Math.hypot(lm[a].x-lm[b].x, lm[a].y-lm[b].y);
    const f = [[8,6],[12,10],[16,14],[20,18]].map(([t, p], i) => (was[i] = d(t, 0) > d(p, 0)*(was[i] ? .98 : 1.1) ? 1 : 0));
    const up = f[0] + f[1] + f[2] + f[3], th = (wasTh = d(4,17) > d(3,17)*(wasTh ? 1.05 : 1.18) ? 1 : 0);
    const raw = up >= 3 ? 'open' : (f[0] && !f[1] && !f[2] && !f[3]) ? 'point' : (f[0] && f[1] && !f[2] && !f[3]) ? 'peace' : (f[0] && !f[1] && !f[2] && f[3]) ? 'rock' : up == 0 ? (th ? 'thumb' : 'fist') : null;
    if (raw) { buf.push(raw); if (buf.length > 6) buf.shift(); const c = {}; buf.forEach(g => c[g] = (c[g] || 0) + 1); const best = Object.keys(c).sort((x, y) => c[y] - c[x])[0]; if (c[best] >= 3) gest = best; }
    moving = gest == 'open';
    // прыжок: резкий взмах руки вверх
    const wy = lm[0].y; if (pWy !== null && now - pT > 20 && (pWy - wy) / ((now - pT)/1000) > 1.8 && now > jCd) { jump(); jCd = now + 700; } pWy = wy; pT = now;
  });
  (async function pump() {
    if (video.readyState >= 2) { try { await hands.send({image: video}); } catch(e){} }
    requestAnimationFrame(pump);
  })();
}

// ====== Игровой цикл ======
let last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(), dt = Math.min(.05, (now-last)/1000); last = now;
  if (!gyro) headQ.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  head.quaternion.copy(headQ);

  const dashing = Date.now() < dashT;
  if ((moving || dashing) && !dead) {
    const f = new THREE.Vector3(0,0,-1).applyQuaternion(headQ); f.y = 0; f.normalize();
    const sp = (itId === me ? 4.4 : 4) * (dashing ? 2 : 1) * dt;
    pos.addScaledVector(f, sp);
  }
  pos.x = Math.max(-ARENA+.6, Math.min(ARENA-.6, pos.x));
  pos.z = Math.max(-ARENA+.6, Math.min(ARENA-.6, pos.z));
  obstacles.forEach(o => { // выталкивание из препятствий
    const dx = pos.x-o.x, dz = pos.z-o.z, d = Math.hypot(dx, dz), min = o.r + .4;
    if (py + .3 < o.h && d < min && d > 0) { pos.x = o.x + dx/d*min; pos.z = o.z + dz/d*min; }
  });
  { const pp = py; vy -= 18*dt; py += vy*dt; let gh = 0; // гравитация и приземление на платформы
    obstacles.forEach(o => { if (o.h <= pp + .3 && o.h > gh && Math.hypot(pos.x-o.x, pos.z-o.z) < o.r + .25) gh = o.h; });
    if (py <= gh) { py = gh; vy = 0; onG = true; } else onG = false; }
  head.position.set(pos.x, 1.6 + py, pos.z);

  gameTick(dt); tickAmb(dt);
  if (offline) updateBot(dt);

  // удалённые игроки
  for (const id in players) {
    if (id === me) continue;
    const p = players[id];
    if (!meshes[id]) meshes[id] = makeAvatar(p.sk ? SKINCOL[p.sk.c] : p.c || 0x4da6ff, p.sk);
    const m = meshes[id];
    m.position.y += ((p.y || 0) - m.position.y) * .3; m.position.x += (p.x - m.position.x) * .25; m.position.z += (p.z - m.position.z) * .25;
    m.rotation.y = p.r; m.visible = !p.dd;
    const isIt = id === itId;
    m.userData.mat.color.setHex(isIt ? 0xff2a2a : m.userData.base);
    m.userData.mat.emissive.setHex(isIt ? 0x880000 : 0);
  }
  for (const id in meshes) if (!players[id]) { scene.remove(meshes[id]); delete meshes[id]; }

  // касание
  if (mode == 'tag' && itId === me && Date.now() - tagT > 3000) {
    for (const id in players) {
      if (id === me) continue;
      if (Math.hypot(players[id].x - pos.x, players[id].z - pos.z) < 1.2 && Math.abs((players[id].y || 0) - py) < 1.3) {
        setIt(id);
        if (navigator.vibrate) navigator.vibrate(200);
        break;
      }
    }
  }

  // HUD
  const cnt = Object.keys(players).length;
  const itName = players[itId] ? players[itId].n : '—';
  const cool = itId === me && Date.now() - tagT < 3000 ? ' (ждёшь 3с)' : '';
  const GI = {open:'✋ бег', fist:'✊ стоп', point:'☝ атака', peace:'✌ рывок', thumb:'👍 щит', rock:'🤘 смена', none:'—'};
  const base = '\n' + (offline ? '🤖 Тренировка' : 'Игроков: ' + cnt) + ' · ' + GI[gest] + ' · 🦘 тап/взмах';
  const txt = mode == 'tag' ? (itId === me ? '🔴 ТЫ ВОДИШЬ! Догоняй!' + cool : '🏃 БЕГИ! Водит: ' + itName) + base
    : winner ? '🏆 Победил: ' + winner : dead ? (mode == 'killer' ? '💀 Ты выбыл\n' + modeHud() : '💀 Возрождение…')
    : modeHud() + '❤ ' + (hp|0) + ' · ☠ ' + kills + (KILLS < 99 ? '/' + KILLS : '') + ' · ' + (tool ? TOOLS[tool].e + ' ' + TOOLS[tool].n : '👇 бери оружие на поясе') + base;
  $('h1').textContent = $('h2').textContent = txt;

  // стерео рендер
  const w = innerWidth, h = innerHeight;
  renderer.setScissorTest(true); renderer.shadowMap.needsUpdate = true; // тени раз за кадр
  renderer.setViewport(0, 0, w/2, h); renderer.setScissor(0, 0, w/2, h); renderer.render(scene, camL);
  renderer.setViewport(w/2, 0, w/2, h); renderer.setScissor(w/2, 0, w/2, h); renderer.render(scene, camR);
}
